name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Tag matches the gem version
        run: test "v$(ruby -Ilib -e 'require "runearc/version"; print Runearc::VERSION')" = "$GITHUB_REF_NAME"
      - name: Get a RubyGems key through trusted publishing
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=rubygems.org" | jq -r .value)
          key=$(jq -n --arg jwt "$jwt" '{jwt: $jwt, owner: "256144"}' \
            | curl -fsS -X POST -H "Content-Type: application/json" --data @- \
              https://rubygems.org/api/v1/oidc/trusted_publisher/exchange_token | jq -r .rubygems_api_key)
          echo "::add-mask::$key"
          echo "GEM_HOST_API_KEY=$key" >> "$GITHUB_ENV"
      - name: Build and push the gem
        run: |
          gem build runearc.gemspec
          gem push runearc-*.gem
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
