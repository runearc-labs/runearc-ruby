name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Tag matches the gem version
        run: test "v$(ruby -Ilib -e 'require "runearc/version"; print Runearc::VERSION')" = "$GITHUB_REF_NAME"
      - uses: rubygems/release-gem@v1
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
